<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Safari native textarea WebDriver probe</title>
  </head>
  <body>
    <label for="native-textarea-probe">Native textarea probe</label>
    <textarea id="native-textarea-probe">seed</textarea>
    <script>
      const editor = document.querySelector('#native-textarea-probe');
      window.__nativeTextareaProbe = { events: [] };
      for (const type of ['keydown', 'keyup', 'beforeinput', 'input']) {
        editor.addEventListener(type, event => window.__nativeTextareaProbe.events.push({
          type,
          inputType: 'inputType' in event ? event.inputType : undefined,
          data: 'data' in event ? event.data : undefined,
          key: 'key' in event ? event.key : undefined,
          metaKey: 'metaKey' in event ? event.metaKey : undefined,
          shiftKey: 'shiftKey' in event ? event.shiftKey : undefined,
          trusted: event.isTrusted
        }), true);
      }
    </script>
  </body>
</html>
