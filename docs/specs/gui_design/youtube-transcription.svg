<svg xmlns="http://www.w3.org/2000/svg" width="548px" height="980px" viewBox="352 66 548 980" role="img" aria-labelledby="title desc" preserveAspectRatio="xMinYMin meet">
<title id="title">YouTube 音源から自動採譜（実験的）</title>
<desc id="desc">YouTube 採譜パネル。フォーム全項目、AIモデル選択と開始操作まで含む。 SVG はベクター要素で構成し、画像を埋め込まない。</desc>
<g transform="translate(352 66)">
<rect width="548" height="980" fill="#020b17" />
<text x="32" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#e3e6ee" text-anchor="start">YouTube 音源から自動採譜（実験的）</text>
<path d="M32 58L516 58" fill="none" stroke="#263143" stroke-width="1" />
<text x="32" y="81" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#aab3c2" text-anchor="start">Gemini AI を使用してYouTubeの動画からコード、ストロークリズム、</text>
<text x="32" y="98" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#aab3c2" text-anchor="start">メロディ五線譜、歌詞を解析し、GuitarDSL楽譜を自動生成します。</text>
<rect x="32" y="116" width="483" height="84" rx="4" fill="#637d7a" stroke="#637d7a" stroke-width="1" />
<text x="48" y="143" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#e6cf35" text-anchor="start">この機能は実験的です。生成結果には誤ったコード、リズム、</text>
<text x="48" y="161" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#e6cf35" text-anchor="start">メロディ、歌詞、BPM などが含まれる可能性があります。結果を</text>
<text x="48" y="179" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#e6cf35" text-anchor="start">下書きとして扱い、必ず確認・修正してください。</text>
<text x="32" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#d7dce5" text-anchor="start">YouTube 動画 URL</text>
<text x="124" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e74c3c" text-anchor="start">*</text>
<rect x="32" y="247" width="483" height="32" rx="4" fill="#171b27" stroke="#a2a8b2" stroke-width="1" />
<text x="42" y="268" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#838b98" text-anchor="start">https://www.youtube.com/watch?v=...</text>
<text x="32" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#d7dce5" text-anchor="start">Gemini API Key</text>
<text x="117" y="302" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#e74c3c" text-anchor="start">*</text>
<rect x="32" y="321" width="404" height="45" rx="4" fill="#171b27" stroke="#a2a8b2" stroke-width="1" />
<text x="42" y="348" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#838b98" text-anchor="start">AIzaSy...</text>
<rect x="444" y="321" width="71" height="45" rx="4" fill="#0b2046" stroke="#21375d" stroke-width="1" />
<text x="479" y="340" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#dce2ed" text-anchor="middle">キーを保</text>
<text x="479" y="355" font-family="Arial, sans-serif" font-size="10" font-weight="500" fill="#dce2ed" text-anchor="middle">存</text>
<text x="32" y="390" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#d7dce5" text-anchor="start">⚙ 採譜設定 (オプション)</text>
<text x="32" y="421" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#d7dce5" text-anchor="start">テンポ (BPM)</text>
<circle cx="38" cy="451" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<circle cx="38" cy="451" r="3" fill="#1688ff" />
<text x="51" y="457" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#dedfe8" text-anchor="start">AIによる自動検出</text>
<circle cx="168" cy="451" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<text x="181" y="457" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#dedfe8" text-anchor="start">指定:</text>
<rect x="226" y="438" width="101" height="32" rx="3" fill="#171b27" stroke="#8d939d" stroke-width="1" />
<text x="239" y="459" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#9098a5" text-anchor="start">185</text>
<text x="32" y="478" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#aab3c2" text-anchor="start">※アップテンポな8ビート（PLAYERS等）でBPMが分かっている場合</text>
<text x="32" y="493" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#aab3c2" text-anchor="start">は数値を指定すると正確に反映されます。</text>
<text x="32" y="533" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#d7dce5" text-anchor="start">カポタスト (Capo)</text>
<circle cx="38" cy="558" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<circle cx="38" cy="558" r="3" fill="#1688ff" />
<text x="51" y="563" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#dedfe8" text-anchor="start">自動判定（押さえやすいオープンコードを提案）</text>
<circle cx="340" cy="558" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<text x="353" y="563" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#dedfe8" text-anchor="start">カポ指定:</text>
<rect x="412" y="550" width="103" height="32" rx="3" fill="#171b27" stroke="#8d939d" stroke-width="1" />
<text x="424" y="571" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#9098a5" text-anchor="start">0</text>
<text x="32" y="608" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#d7dce5" text-anchor="start">ビート種別 (Beat Type)</text>
<circle cx="38" cy="629" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<circle cx="38" cy="629" r="3" fill="#1688ff" />
<text x="51" y="634" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#dedfe8" text-anchor="start">自動判定 (AIが判別)</text>
<circle cx="180" cy="629" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<text x="193" y="634" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#dedfe8" text-anchor="start">8ビート優先</text>
<circle cx="281" cy="629" r="5.5" fill="none" stroke="#d5d7de" stroke-width="1.2" />
<text x="294" y="634" font-family="Arial, sans-serif" font-size="10" font-weight="400" fill="#dedfe8" text-anchor="start">16ビート優先</text>
<text x="32" y="664" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#d7dce5" text-anchor="start">伴奏パターン (ストローク／アルペジオ)</text>
<rect x="32" y="683" width="483" height="34" rx="4" fill="#171b27" stroke="#8b8e98" stroke-width="1" />
<text x="42" y="704.0" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#dce1e9" text-anchor="start">自動（曲に合わせて耳コピ・定番パターンを優先）</text>
<path d="M497 699.0l4 4l4 -4" fill="none" stroke="#dce1e9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<rect x="32" y="739" width="14" height="14" rx="2" fill="#f3f4f6" stroke="#d7d8de" stroke-width="1" />
<text x="53" y="752" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#d7dce5" text-anchor="start">繰り返し区間を圧縮して楽譜を短縮（複数行歌詞）</text>
<text x="53" y="770" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#aab3c2" text-anchor="start">同一のコード進行・メロディを持つセクションをリピート記号（:||）と</text>
<text x="53" y="784" font-family="Arial, sans-serif" font-size="9" font-weight="400" fill="#aab3c2" text-anchor="start">複数行歌詞にまとめてコンパクトに出力します。</text>
<text x="32" y="828" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#d7dce5" text-anchor="start">AIモデル</text><rect x="32" y="840" width="483" height="34" rx="3" fill="#171b27" stroke="#707782" stroke-width="1" /><text x="42" y="862" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#d8dee9" text-anchor="start">Gemini 3.8 Flash（推奨・高速高精度）</text><path d="M 497 854 l 5 5 l 5 -5" fill="none" stroke="#d8dee9" stroke-width="1.4" /><rect x="32" y="890" width="483" height="34" rx="3" fill="#373a3d" stroke="#45494f" stroke-width="1" opacity="0.58" /><text x="273.5" y="912" font-family="Arial, sans-serif" font-size="11" font-weight="500" fill="#a1a6ad" text-anchor="middle">▶ 採譜を開始する</text></g>
</svg>