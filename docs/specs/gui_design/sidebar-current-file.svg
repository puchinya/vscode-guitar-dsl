<text x="42" y="88" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#d9dbe5" text-anchor="start">サンプルを開く</text>
<text x="21" y="110" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#c4c7d3" text-anchor="start">▱</text>
<text x="42" y="110" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#d9dbe5" text-anchor="start">プレビューを横に開く</text>
<text x="21" y="132" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#c4c7d3" text-anchor="start">ⓘ</text>
<text x="42" y="132" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#d9dbe5" text-anchor="start">ヘルプを開く</text>
<path d="M20 148l4 4l4 -4" fill="none" stroke="#c8c8c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
<text x="35" y="152" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e3eb" text-anchor="start">現在のファイル</text>
