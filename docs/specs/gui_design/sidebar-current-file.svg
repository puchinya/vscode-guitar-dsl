<text x="12" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#e6e7ef" text-anchor="start">GuitarDSL: はじめに</text>
<path d="M0 31L300 31" fill="none" stroke="#22253a" stroke-width="1" />
<path d="M20 39l4 4l4 -4" fill="none" stroke="#c8c8c8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
