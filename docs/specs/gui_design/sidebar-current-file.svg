<svg xmlns="http://www.w3.org/2000/svg" width="300px" height="350px" viewBox="48 36 300 350" role="img" aria-labelledby="title desc" preserveAspectRatio="xMinYMin meet">
<title id="title">GuitarDSL サイドバー - 現在のファイル</title>
<desc id="desc">GuitarDSL 文書がアクティブなときのサイドバー。6つの文書操作をすべて表示する。 SVG はベクター要素で構成し、画像を埋め込まない。</desc>
+<g transform="translate(48 36)">
<rect width="300" height="350" fill="#06061f" />
