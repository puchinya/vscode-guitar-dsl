<text x="42" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#d9dbe5" text-anchor="start">プレビューを横に開く</text>
<text x="21" y="197" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#c4c7d3" text-anchor="start">✎</text>
<text x="42" y="197" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#d9dbe5" text-anchor="start">コードダイアグラムを編集</text>
