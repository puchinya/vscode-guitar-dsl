<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" aria-label="Issue 180 GuitarDSL Library root, folder, and score context menus"><title>Issue 180 GuitarDSL Library context menus</title><rect width="1600" height="720" fill="#202229"/><text x="40" y="52" font-family="Arial, Noto Sans JP, sans-serif" font-size="26" font-weight="700" fill="#e6e8ee">GuitarDSL ライブラリ — コンテキストメニュー</text><text x="40" y="86" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#99a3b5">ルート・フォルダー・楽譜の各メニューで対象IDを再検証し、同じGoogle Driveリンクを提供</text><rect x="40" y="120" width="480" height="530" rx="8" fill="#292d36" stroke="#424652"/><text x="64" y="158" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">ライブラリ</text><text x="68" y="184" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee">新しい楽譜</text><text x="68" y="232" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee">新しいフォルダー</text><text x="68" y="280" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee">Google Driveからインポート…</text><text x="68" y="328" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee">更新</text><rect x="52" y="348" width="456" height="40" rx="4" fill="#333f59"/><text x="68" y="376" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#dce5ff">Google Driveで開く</text><text x="68" y="424" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee">ライブラリについて</text><rect x="560" y="120" width="480" height="530" rx="8" fill="#292d36" stroke="#424652"/><text x="584" y="158" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="700" fill="#e6e8ee">フォルダー</text><text x="588" y="184" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee">開く / 閉じる</text><text x="588" y="232" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" fill="#e6e8ee"