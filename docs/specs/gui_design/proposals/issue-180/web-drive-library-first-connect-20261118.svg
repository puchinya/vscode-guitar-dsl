ht="650" fill="#e6e8ee">ライブラリの作成</text><text x="550" y="247" font-family="Arial,'Noto Sans JP',sans-serif" font-size="15" font-weight="400" fill="#e6e8ee">My Drive直下にGuitarDSLフォルダーはありません。</text><text x="550" y="285" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="400" fill="#99a3b5">作成後はこのフォルダーをライブラリとして使います。</text><text x="550" y="308" font-family="Arial,'Noto Sans JP',sans-serif" font-size="12" font-weight="400" fill="#99a3b5">既存の別フォルダーやファイルは変更しません。</text><rect x="558" y="368" width="128" height="42" rx="5" fill="#566cda" /><text x="587" y="394" font-family="Arial,'Noto Sans JP',sans-serif" font-size="13" font-weight="650" fill="#ffffff">作成</text><rect x="909" y="368" width="116" height="42" rx="5" fill="#383e4c" /><text x="940" y="394" font-family="Arial,'Noto Sans JP',sans-serif" font-size="14" font-weight="400" fill="#e6e8ee">後で</text><text x="56" y="575" font-family="Arial,'Noto Sans JP',sans-serif" font-size="11" font-weight="400" fill="#99a3b5">既存のMy Drive/GuitarDSLは同じIDで再利用。新規rootは確認後に作成し、未許可のDrive内ファイルは表示しない。</text></svg>