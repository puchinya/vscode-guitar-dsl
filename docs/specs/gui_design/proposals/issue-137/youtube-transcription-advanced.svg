<svg xmlns="http://www.w3.org/2000/svg" width="548px" height="1000px" viewBox="0 0 548 1000" role="img" aria-labelledby="t d"><title id="t">YouTube 採譜・詳細設定展開（#137案）</title><desc id="d">現行のYouTube採譜Panelを保ったまま詳細設定とAPIキー管理を段階的に表示</desc><rect width="548" height="1000" fill="#090d20"/><text x="30" y="42" font-size="19" font-weight="700" fill="#f0f2f8" font-family="Arial,'Noto Sans JP',sans-serif">YouTube音源から自動採譜（実験的）</text><path d="M9 56 H539" stroke="#353b52"/><text x="30" y="84" font-size="12" font-weight="400" fill="#acb8cf" font-family="Arial,'Noto Sans JP',sans-serif">Gemini AIでコード・リズム・メロディ・歌詞を解析し、</text><text x="30" y="103" font-size="12" font-weight="400" fill="#acb8cf" font-family="Arial,'Noto Sans JP',sans-serif">新しいGuitarDSL文書を作ります。</text><rect x="30" y="120" width="487" height="66" rx="5" fill="#353b2d" stroke="#7b7540"/><text x="43" y="147" font-size="12" font-weight="600" fill="#fff0a3" font-family="Arial,'Noto Sans JP',sans-serif">実験的: 結果は下書きです。生成後に必ず確認・修正してください。</text><text x="43" y="169" font-size="12" font-weight="400" fill="#fff0a3" font-family="Arial,'Noto Sans JP',sans-serif">コード・BPM・歌詞などが誤っている可能性があります。</text><text x="30" y="217" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">YouTube動画 URL *</text><rect x="30" y="231" width="487" height="38" rx="5" fill="#18243a" stroke="#586680"/><text x="42" y="256" font-size="12" font-weight="400" fill="#a7b4c8" font-family="Arial,'Noto Sans JP',sans-serif">https://www.youtube.com/watch?v=...</text><text x="30" y="302" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">Gemini APIキー</text><text x="150" y="302" font-size="11" font-weight="400" fill="#a2b3c9" font-family="Arial,'Noto Sans JP',sans-serif">未設定 / 保存済み状態のみ表示</text><rect x="30" y="315" width="487" height="42" rx="5" fill="#18243a" stroke="#586680"/><text x="44" y="342" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">鍵の状態: 未設定</text><text x="388" y="342" font-size="12" font-weight="600" fill="#76b9ff" font-family="Arial,'Noto Sans JP',sans-serif">設定・変更  ▾</text><rect x="30" y="373" width="487" height="43" rx="5" fill="#202d47" stroke="#687899"/><text x="44" y="401" font-size="14" font-weight="700" fill="#f0f2fa" font-family="Arial,'Noto Sans JP',sans-serif">▾  採譜設定（詳細）</text><text x="35" y="444" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">テンポ（BPM）</text><text x="55" y="476" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">◉ 自動検出</text><text x="230" y="476" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">○ 指定</text><rect x="340" y="453" width="177" height="32" rx="5" fill="#18243a" stroke="#586680"/><text x="357" y="475" font-size="12" font-weight="400" fill="#a7b4c8" font-family="Arial,'Noto Sans JP',sans-serif">185</text><text x="35" y="519" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">カポ</text><text x="55" y="550" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">◉ 自動判定</text><text x="230" y="550" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">○ 指定</text><rect x="340" y="528" width="177" height="32" rx="5" fill="#18243a" stroke="#586680"/><text x="357" y="550" font-size="12" font-weight="400" fill="#a7b4c8" font-family="Arial,'Noto Sans JP',sans-serif">0</text><text x="35" y="592" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">ビート種別</text><text x="55" y="620" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">◉ 自動</text><text x="213" y="620" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">○ 8ビート</text><text x="364" y="620" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">○ 16ビート</text><text x="35" y="664" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">伴奏パターン（ストローク／アルペジオ）</text><rect x="30" y="676" width="487" height="36" rx="5" fill="#18243a" stroke="#586680"/><text x="43" y="699" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">自動（曲に合わせて判定）                               ▾</text><text x="40" y="751" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">□ 繰り返し区間を圧縮して楽譜を短縮</text><text x="48" y="772" font-size="11" font-weight="400" fill="#a2b3c9" font-family="Arial,'Noto Sans JP',sans-serif">同一コード・メロディをリピート記号へまとめる</text><text x="35" y="816" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">AIモデル</text><rect x="30" y="826" width="487" height="36" rx="5" fill="#18243a" stroke="#586680"/><text x="43" y="849" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">Gemini 3.8 Flash（既存の既定値）                        ▾</text><rect x="30" y="891" width="487" height="45" rx="5" fill="#244163" stroke="#537fa2"/><text x="220" y="920" font-size="13" font-weight="700" fill="#dde9f8" font-family="Arial,'Noto Sans JP',sans-serif">採譜を開始する</text><text x="30" y="966" font-size="11" font-weight="400" fill="#9baac4" font-family="Arial,'Noto Sans JP',sans-serif">開始後は既存の段階進捗・エラーを表示します。</text></svg>