<svg xmlns="http://www.w3.org/2000/svg" width="548px" height="528px" viewBox="0 0 548 528" role="img" aria-labelledby="t d"><title id="t">YouTube 採譜・初期画面（#137案）</title><desc id="d">現行のYouTube採譜Panelを保ったまま詳細設定とAPIキー管理を段階的に表示</desc><rect width="548" height="528" fill="#090d20"/><text x="30" y="42" font-size="19" font-weight="700" fill="#f0f2f8" font-family="Arial,'Noto Sans JP',sans-serif">YouTube音源から自動採譜（実験的）</text><path d="M9 56 H539" stroke="#353b52"/><text x="30" y="84" font-size="12" font-weight="400" fill="#acb8cf" font-family="Arial,'Noto Sans JP',sans-serif">Gemini AIでコード・リズム・メロディ・歌詞を解析し、</text><text x="30" y="103" font-size="12" font-weight="400" fill="#acb8cf" font-family="Arial,'Noto Sans JP',sans-serif">新しいGuitarDSL文書を作ります。</text><rect x="30" y="120" width="487" height="66" rx="5" fill="#353b2d" stroke="#7b7540"/><text x="43" y="147" font-size="12" font-weight="600" fill="#fff0a3" font-family="Arial,'Noto Sans JP',sans-serif">実験的: 結果は下書きです。生成後に必ず確認・修正してください。</text><text x="43" y="169" font-size="12" font-weight="400" fill="#fff0a3" font-family="Arial,'Noto Sans JP',sans-serif">コード・BPM・歌詞などが誤っている可能性があります。</text><text x="30" y="217" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">YouTube動画 URL *</text><rect x="30" y="231" width="487" height="38" rx="5" fill="#18243a" stroke="#586680"/><text x="42" y="256" font-size="12" font-weight="400" fill="#a7b4c8" font-family="Arial,'Noto Sans JP',sans-serif">https://www.youtube.com/watch?v=...</text><text x="30" y="302" font-size="13" font-weight="600" fill="#eaf0f8" font-family="Arial,'Noto Sans JP',sans-serif">Gemini APIキー</text><text x="150" y="302" font-size="11" font-weight="400" fill="#a2b3c9" font-family="Arial,'Noto Sans JP',sans-serif">未設定 / 保存済み状態のみ表示</text><rect x="30" y="315" width="487" height="42" rx="5" fill="#18243a" stroke="#586680"/><text x="44" y="342" font-size="12" font-weight="400" fill="#e5edf9" font-family="Arial,'Noto Sans JP',sans-serif">鍵の状態: 未設定</text><text x="388" y="342" font-size="12" font-weight="600" fill="#76b9ff" font-family="Arial,'Noto Sans JP',sans-serif">設定・変更  ▾</text><rect x="30" y="380" width="487" height="48" rx="5" fill="#141f34" stroke="#697a94"/><text x="44" y="410" font-size="14" font-weight="600" fill="#e7eefa" font-family="Arial,'Noto Sans JP',sans-serif">▸  採譜設定（詳細）</text><rect x="30" y="450" width="487" height="43" rx="5" fill="#244163" stroke="#537fa2"/><text x="225" y="477" font-size="13" font-weight="700" fill="#dde9f8" font-family="Arial,'Noto Sans JP',sans-serif">採譜を開始する</text><text x="30" y="518" font-size="11" font-weight="400" fill="#9aa9c3" font-family="Arial,'Noto Sans JP',sans-serif">URLとAPIキーが未設定のため実行できません。</text></svg>