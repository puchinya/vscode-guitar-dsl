    <text x="520" y="132" font-size="18" text-anchor="middle">●</text>
    <text x="730" y="152" font-size="18" text-anchor="middle">●</text>
    <text x="940" y="138" font-size="18" text-anchor="middle">●</text>
  </g>
  <g stroke="#111" stroke-width="4" stroke-linecap="square">
    <path d="M 286 278 l 12 -18 M 338 278 l 12 -18 M 390 278 l 12 -18 M 442 278 l 12 -18"/>
    <path d="M 496 278 l 12 -18 M 548 278 l 12 -18 M 600 278 l 12 -18 M 652 278 l 12 -18"/>
