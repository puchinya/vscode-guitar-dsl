    <path d="M 172 242 H 1012 M 172 252 H 1012 M 172 262 H 1012 M 172 272 H 1012 M 172 282 H 1012"/>
    <path d="M 172 118 V 158 M 382 118 V 158 M 592 118 V 158 M 802 118 V 158 M 1012 118 V 158"/>
    <path d="M 172 242 V 282 M 382 242 V 282 M 592 242 V 282 M 802 242 V 282 M 1012 242 V 282"/>
  </g>
