<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
  <title id="title">歌唱譜表とギター譜表をまとめる外側ブラケット</title>
  <desc id="desc">歌唱メロディとギター伴奏の2段譜。左端線は両段を結び、ブラケットだけがグループを示す。</desc>
  <rect width="1080" height="400" fill="#fff"/>
  <text x="65" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111">歌唱＋ギター伴奏（2段譜）</text>
  <text x="65" y="76" font-family="Arial, sans-serif" font-size="15" fill="#555">別パートのまとまりは細い外側ブラケットで示す。内側ブレースは使わない。</text>
  <text x="172" y="108" font-family="Arial, sans-serif" font-size="14" fill="#555">Vocal melody</text>
  <text x="172" y="232" font-family="Arial, sans-serif" font-size="14" fill="#555">Guitar rhythm</text>
