    <path d="M 172 118 H 1012 M 172 128 H 1012 M 172 138 H 1012 M 172 148 H 1012 M 172 158 H 1012"/>
    <path d="M 172 242 H 1012 M 172 252 H 1012 M 172 262 H 1012 M 172 272 H 1012 M 172 282 H 1012"/>
    <path d="M 172 118 V 158 M 382 118 V 158 M 592 118 V 158 M 802 118 V 158 M 1012 118 V 158"/>
    <path d="M 172 242 V 282 M 382 242 V 282 M 592 242 V 282 M 802 242 V 282 M 1012 242 V 282"/>
  </g>
  <g fill="#111" font-family="Arial, sans-serif">
    <text x="310" y="142" font-size="18" text-anchor="middle">●</text>
    <text x="520" y="132" font-size="18" text-anchor="middle">●</text>
    <text x="730" y="152" font-size="18" text-anchor="middle">●</text>
    <text x="940" y="138" font-size="18" text-anchor="middle">●</text>
  </g>
  <g stroke="#111" stroke-width="4" stroke-linecap="square">
    <path d="M 286 278 l 12 -18 M 338 278 l 12 -18 M 390 278 l 12 -18 M 442 278 l 12 -18"/>
    <path d="M 496 278 l 12 -18 M 548 278 l 12 -18 M 600 278 l 12 -18 M 652 278 l 12 -18"/>
    <path d="M 706 278 l 12 -18 M 758 278 l 12 -18 M 810 278 l 12 -18 M 862 278 l 12 -18"/>
    <path d="M 916 278 l 12 -18 M 968 278 l 12 -18"/>
  </g>
  <path class="staff-bracket" d="M 6 0 C 4.6 0.9, 3.1 1.4, 0 1.6 L 0 198.4 C 3.1 198.6, 4.6 199.1, 6 200 C 5 198.3, 4.4 196.4, 4.4 194.4 L 1.6 194.4 L 1.6 5.6 L 4.4 5.6 C 4.4 3.6, 5 1.7, 6 0 Z" transform="translate(158 118) scale(1 0.82)" fill="#000"/>
  <line class="staff-group-left-connector" x1="172" y1="118" x2="172" y2="282" stroke="#111" stroke-width="1.5"/>
  <g stroke="#111" stroke-width="1.5">
    <path d="M 382 158 V 242 M 592 158 V 242 M 802 158 V 242"/>
  </g>
  <text x="65" y="352" font-family="Arial, sans-serif" font-size="14" fill="#555">ブラケットの縦幹は1.6単位幅、端のフックは右向き6単位以内。五線・調号・小節xは移動しない。</text>
</svg>
