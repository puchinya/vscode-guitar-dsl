<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
  <title id="title">ギターTAB譜とリズム譜を結ぶ音楽用ブレース</title>
  <desc id="desc">歌唱譜表を含まないギター用2段譜。TAB譜とリズム譜の左に閉じたベジェ曲線のブレースを1つ置く。</desc>
  <rect width="1080" height="400" fill="#fff"/>
  <text x="65" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111">ギターTAB＋リズム（2段譜）</text>
  <text x="65" y="76" font-family="Arial, sans-serif" font-size="15" fill="#555">ブレースは同じギターのTAB譜表とリズム譜表だけを結ぶ</text>
  <text x="172" y="108" font-family="Arial, sans-serif" font-size="14" fill="#555">Guitar TAB</text>
  <text x="172" y="232" font-family="Arial, sans-serif" font-size="14" fill="#555">Chord / Strum</text>
  <g stroke="#222" stroke-width="1.25" fill="none">
    <path d="M 172 118 H 1012 M 172 126 H 1012 M 172 134 H 1012 M 172 142 H 1012 M 172 150 H 1012 M 172 158 H 1012"/>
    <path d="M 172 242 H 1012 M 172 252 H 1012 M 172 262 H 1012 M 172 272 H 1012 M 172 282 H 1012"/>
    <path d="M 172 118 V 158 M 382 118 V 158 M 592 118 V 158 M 802 118 V 158 M 1012 118 V 158"/>
    <path d="M 172 242 V 282 M 382 242 V 282 M 592 242 V 282 M 802 242 V 282 M 1012 242 V 282"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#111">
    <text x="310" y="138" font-size="15" text-anchor="middle">0</text>
    <text x="520" y="138" font-size="15" text-anchor="middle">2</text>
    <text x="730" y="138" font-size="15" text-anchor="middle">3</text>
    <text x="940" y="138" font-size="15" text-anchor="middle">5</text>
    <text x="310" y="230" font-size="18" font-weight="700" text-anchor="middle">C</text>
    <text x="520" y="230" font-size="18" font-weight="700" text-anchor="middle">G</text>
    <text x="730" y="230" font-size="18" font-weight="700" text-anchor="middle">Am</text>
    <text x="940" y="230" font-size="18" font-weight="700" text-anchor="middle">F</text>
  </g>
  <g stroke="#111" stroke-width="4" stroke-linecap="square">
    <path d="M 286 278 l 12 -18 M 338 278 l 12 -18 M 390 278 l 12 -18 M 442 278 l 12 -18"/>
    <path d="M 496 278 l 12 -18 M 548 278 l 12 -18 M 600 278 l 12 -18 M 652 278 l 12 -18"/>
    <path d="M 706 278 l 12 -18 M 758 278 l 12 -18 M 810 278 l 12 -18 M 862 278 l 12 -18"/>
    <path d="M 916 278 l 12 -18 M 968 278 l 12 -18"/>
  </g>
  <path class="staff-brace" d="M 22 0 C 6 5, 1 18, 2 31 C 2 43, 10 52, 15 59 C 20 66, 20 80, 10 90 C 8 93, 5 97, 3.5 100 C 5 103, 8 107, 10 110 C 20 120, 20 134, 15 141 C 10 148, 2 157, 2 169 C 1 182, 6 195, 22 200 C 11 193, 8 180, 9 169 C 10 156, 17 146, 21 136 C 24 124, 18 111, 4.5 100 C 18 89, 24 76, 21 64 C 17 54, 10 44, 9 31 C 8 20, 11 7, 22 0 Z" transform="translate(147 118) scale(1 0.82)" fill="#000"/>
  <line class="staff-group-left-connector" x1="172" y1="118" x2="172" y2="282" stroke="#111" stroke-width="1.5"/>
  <g stroke="#111" stroke-width="1.5">
    <path d="M 382 158 V 242 M 592 158 V 242 M 802 158 V 242"/>
  </g>
  <text x="65" y="352" font-family="Arial, sans-serif" font-size="14" fill="#555">形状参考：中央のくびれは細く、上下の曲線を保つ。横幅は固定し、譜表間隔に合わせて縦だけを拡縮する。</text>
</svg>
