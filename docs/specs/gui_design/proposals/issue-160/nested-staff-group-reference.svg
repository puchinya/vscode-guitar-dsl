<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" role="img" aria-labelledby="title desc">
  <title id="title">歌唱とギター2譜表のネストされたグループ記号</title>
  <desc id="desc">3段譜では外側ブラケットが歌唱とギター全体を囲み、内側ブレースはTABとリズムのギター譜表だけを結ぶ。 Bravura bracketTop/Bottom (SMuFL U+E003/U+E004), SIL OFL 1.1.</desc>
  <rect width="1080" height="400" fill="#fff"/>
  <text x="65" y="42" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111">歌唱＋TAB＋リズム（3段譜）</text>
  <text x="65" y="68" font-family="Arial, sans-serif" font-size="15" fill="#555">外側ブラケットは全3段、内側ブレースはギターの下2段だけを結ぶ</text>
  <text x="172" y="96" font-family="Arial, sans-serif" font-size="14" fill="#555">Vocal melody</text>
  <text x="172" y="172" font-family="Arial, sans-serif" font-size="14" fill="#555">Guitar TAB</text>
  <text x="172" y="248" font-family="Arial, sans-serif" font-size="14" fill="#555">Guitar rhythm</text>
