name: Deploy Web to Cloudflare Workers

on:
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: read
  deployments: write

jobs:
  development:
    name: Deploy dev.guitardsl.app
    if: github.ref == 'refs/heads/main' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://dev.guitardsl.app
    concurrency:
      group: cloudflare-web-development
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static Web app
        run: npm run build:web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      - name: Verify build output
        run: test -f web/dist/index.html
      - name: Publish to development Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config wrangler.jsonc --env development

  production:
    name: Deploy guitardsl.app
    if: startsWith(github.ref, 'refs/tags/') && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://guitardsl.app
    concurrency:
      group: cloudflare-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit reachable from main"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static Web app
        run: npm run build:web
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      - name: Verify build output
        run: test -f web/dist/index.html
      - name: Publish to existing production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: deploy --config wrangler.jsonc
