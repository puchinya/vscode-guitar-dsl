name: Deploy Web to Cloudflare Workers

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "**"

permissions:
  contents: read
  deployments: write

jobs:
  validate-marketing:
    name: Validate marketing artifacts
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build static Web app
        run: npm run build:web
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://www.guitardsl.app/
      - name: Verify Web app build output
        run: test -f web/dist/index.html
      - name: Verify production Help link target and isolation
        run: npm run test:e2e --workspace web -- --project=chromium --grep "Help menu keeps its nine ordered actions"
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://www.guitardsl.app/
      - name: Verify development Help link target and isolation
        run: npm run test:e2e --workspace web -- --project=chromium --grep "Help menu keeps its nine ordered actions"
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://wwwdev.guitardsl.app/
      - name: Build and verify development product introduction
        run: |
          npm run build:marketing -- --target development
          npm run check:marketing -- --target development
      - name: Build and verify production product introduction
        run: |
          npm run build:marketing -- --target production
          npm run check:marketing -- --target production

  development:
    name: Deploy dev.guitardsl.app
    if: github.ref == 'refs/heads/main' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: development
      url: https://dev.guitardsl.app
    concurrency:
      group: cloudflare-web-development
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build static Web app
        run: npm run build:web
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://wwwdev.guitardsl.app/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      - name: Verify development Help link target and isolation
        run: npm run test:e2e --workspace web -- --project=chromium --grep "Help menu keeps its nine ordered actions"
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://wwwdev.guitardsl.app/
      - name: Verify build output
        run: test -f web/dist/index.html
      - name: Build and verify development product introduction
        run: |
          npm run build:marketing -- --target development
          npm run check:marketing -- --target development
      - name: Publish development Preview of production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.160.0'
          command: preview --config wrangler.jsonc --name dev
      - name: Publish development product introduction Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.160.0'
          command: deploy --config wrangler-marketing-dev.jsonc

  production:
    name: Deploy guitardsl.app
    if: startsWith(github.ref, 'refs/tags/') && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: https://guitardsl.app
    concurrency:
      group: cloudflare-web-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tagged_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tagged_commit" refs/remotes/origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit reachable from main"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Build static Web app
        run: npm run build:web
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://www.guitardsl.app/
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
      - name: Verify production Help link target and isolation
        run: npm run test:e2e --workspace web -- --project=chromium --grep "Help menu keeps its nine ordered actions"
        env:
          VITE_GUITARDSL_PRODUCT_INTRO_URL: https://www.guitardsl.app/
      - name: Verify build output
        run: test -f web/dist/index.html
      - name: Build and verify production product introduction
        run: |
          npm run build:marketing -- --target production
          npm run check:marketing -- --target production
      - name: Publish to existing production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.160.0'
          command: deploy --config wrangler.jsonc
      - name: Publish production product introduction Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4.160.0'
          command: deploy --config wrangler-marketing.jsonc
