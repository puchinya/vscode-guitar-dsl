name: agent-required-check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-required-check:
    name: agent-required-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Check Help synchronization
        run: npm run check:help

      - name: Check AI documentation synchronization
        run: npm run check:ai

      - name: Run unit tests
        run: npm run test:unit

      - name: Build and typecheck Web SPA
        run: npm run build:web

      - name: Run Web unit tests
        run: npm run test:unit --workspace web
